# ==============================================================================
# Nginx Virtual Host Config – GotIt Standalone Webhook Service
# Port: 8081 (HTTP, internal only – proxy từ HTTPS :443)
# ==============================================================================
#
# HƯỚNG DẪN TRIỂN KHAI (Nginx):
# --------------------------------
# 1. Copy file này vào: /etc/nginx/sites-available/gotit-webhook
# 2. Tạo symlink: sudo ln -s /etc/nginx/sites-available/gotit-webhook /etc/nginx/sites-enabled/
# 3. Điều chỉnh:
#      - root path       : đường dẫn thực tế đến thư mục gotit-webhook-service
#      - fastcgi_pass    : socket PHP-FPM của bạn (php8.1-fpm, php8.2-fpm, ...)
#      - server_name     : IP hoặc hostname của server (nếu cần)
#      - allow/deny IPs  : uncomment và điền IP của Got It nếu muốn whitelist ở tầng Nginx
# 4. Test & reload:
#      sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# -----------------------------------------------------------------------
# BLOCK 1: Webhook Service nội bộ – lắng nghe trên 127.0.0.1:8081
# KHÔNG expose ra internet trực tiếp. Chỉ nhận request từ proxy (Block 2).
# -----------------------------------------------------------------------
server {
    listen 127.0.0.1:8081;
    server_name localhost;

    # Thay đường dẫn theo server thực tế:
    root /var/www/bsc-game/wp-content/plugins/game-bsc/gotit-webhook-service;
    index index.php;

    # Tắt access log
    access_log off;
    error_log /var/log/nginx/gotit_webhook_error.log warn;

    # Chỉ cho phép POST đến /  (index.php)
    location = / {
        try_files $uri /index.php;
    }

    # Xử lý PHP qua FPM
    location ~ ^/index\.php$ {
        # Điều chỉnh fastcgi_pass theo phiên bản PHP FPM:
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        # fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        # fastcgi_pass 127.0.0.1:9000;  # nếu dùng TCP

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        # Truyền IP thực của client qua header
        fastcgi_param HTTP_X_REAL_IP       $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        # Timeout
        fastcgi_read_timeout 30s;
    }

    # Chặn truy cập trực tiếp vào mọi file .php khác (config.php, etc.)
    location ~ \.php$ {
        return 403;
    }

    # Chặn truy cập file nhạy cảm
    location ~* \.(log|bak|ini|conf|lock|md)$ {
        return 403;
    }

    # Chặn tất cả request không phải đến /
    location / {
        return 404;
    }
}

