# ==============================================================================
# Apache VirtualHost Config – GotIt Standalone Webhook Service
# Port: 8081 (HTTP, internal only – recommended to proxy via HTTPS from :443)
# ==============================================================================
#
# HƯỚNG DẪN TRIỂN KHAI (Apache):
# --------------------------------
# 1. Mở file cấu hình Apache chính:
#      - Ubuntu/Debian : /etc/apache2/ports.conf + /etc/apache2/sites-available/
#      - CentOS/RHEL   : /etc/httpd/conf/httpd.conf
#      - Laragon (Win) : C:\laragon\etc\apache2\extra\httpd-vhosts.conf
#
# 2. Thêm "Listen 8081" vào ports.conf (hoặc httpd.conf nếu chưa có)
#
# 3. Copy block <VirtualHost> bên dưới vào file site config của bạn
#
# 4. Điều chỉnh:
#      - DocumentRoot  : đường dẫn thực tế đến thư mục gotit-webhook-service
#      - ErrorLog path : đường dẫn log hợp lệ trên server
#      - php-fpm socket: thay đổi theo phiên bản PHP đang dùng (nếu dùng mpm_event)
#
# 5. Reload Apache:
#      - Linux : sudo systemctl reload apache2   (hoặc httpd)
#      - Laragon: Restart qua Laragon UI
# ==============================================================================

# Mở port 8081 (thêm vào ports.conf hoặc httpd.conf nếu chưa có)
# Listen 8081

<VirtualHost *:8081>
    ServerName localhost
    # Thay đường dẫn theo server thực tế:
    DocumentRoot /var/www/bsc-game/wp-content/plugins/game-bsc/gotit-webhook-service

    # Chỉ xử lý index.php – không cần directory listing
    DirectoryIndex index.php

    # Tắt access log để giảm I/O (webhook log đã tự ghi trong PHP)
    CustomLog /dev/null combined

    # Chỉ log lỗi nghiêm trọng
    ErrorLog /var/log/apache2/gotit_webhook_error.log
    LogLevel warn

    <Directory /var/www/bsc-game/wp-content/plugins/game-bsc/gotit-webhook-service>
        Options -Indexes -FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Chặn truy cập trực tiếp vào file nhạy cảm qua HTTP
    <FilesMatch "\.(log|bak|ini|conf)$">
        Require all denied
    </FilesMatch>

    # Chỉ cho phép truy cập index.php, chặn tất cả .php còn lại
    <FilesMatch "^(?!index).*\.php$">
        Require all denied
    </FilesMatch>

    # Header bảo mật
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
</VirtualHost>

# ==============================================================================
